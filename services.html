<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Services · Bustard Consulting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/tokens.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'G-TX8VCPEDJW');

        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};

</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="js/direction-shared.jsx"></script>
  <script type="text/babel" src="js/layout.jsx"></script>
  <script type="text/babel" data-presets="react">
(function() {
  const PAD = 86;

  const pillars = [
    {
      n: '01',
      t: 'Strategic Advisory',
      lead: 'Validating the opportunity and defining direction — for rights-holders, investors and IP.',
      scope: [
        'Feasibility and IP assessment',
        'Commercial modelling and investor structures',
        'Board-level alignment and governance',
      ],
      outcomes: [
        'Clear go / no-go validation',
        'A viable commercial path to greenlight',
        'Stakeholder alignment across all parties',
      ],
    },
    {
      n: '02',
      t: 'Structured Development',
      lead: 'Translating ambition into structured, fundable development plans.',
      scope: [
        'Creative, technical and financial leadership',
        'Multi-agency programme management',
        'Development blueprints — narrative, spatial, real-time, capture',
      ],
      outcomes: [
        'A single accountable leader',
        'Faster development with fewer failures',
        'Investor-grade confidence at greenlight',
      ],
    },
    {
      n: '03',
      t: 'Executive Production',
      lead: 'Senior leadership through build, rehearsal and launch.',
      scope: [
        'End-to-end delivery structures and governance',
        'Real-time technical pipeline oversight',
        'Vendor and partner selection',
      ],
      outcomes: [
        'Predictable, structured delivery',
        'Lower risk of overruns and project failure',
        'Stakeholder calm through launch',
      ],
    },
  ];

  const phases = [
    { n: '01', t: 'Concept & Alignment',                body: 'Defining objectives, mapping delivery routes and assessing technology fit.' },
    { n: '02', t: 'Structured Development',             body: 'Creative, technical and financial blueprinting across narrative, audience and pipeline.' },
    { n: '03', t: 'Commercial Architecture',            body: 'Business models, investor-grade financial modelling and commercial structuring.' },
    { n: '04', t: 'Experience & Technical Architecture',body: 'Spatial design, real-time pipelines and proof-of-concept.' },
    { n: '05', t: 'Programme & Delivery Governance',    body: 'Programme, risk, governance, vendor alignment and QA.' },
    { n: '06', t: 'Investment & Stakeholder Alignment', body: 'Investor packs, information memoranda and board-level alignment.' },
    { n: '07', t: 'Operational Delivery',                body: 'Senior delivery leadership through build, rehearsal, launch and post-delivery review.' },
  ];

  function ServicesPage() {
    return (
      <div data-screen-label="Services">
        <SiteNav active="services" />

        <PageHeader
          number="§ 03"
          label="Services"
          title="Strategy, Development & Executive Production."
          lede="Three integrated disciplines for live, immersive and IP-led audience experiences."
          sweep={3}
        />

        {/* Pillars — three-column structured table.
            Each pillar is one row: positioning → typical scope → outcomes.
            Narrower max-width and consistent column rhythm so the eye
            scans across without long travel between data points. */}
        <PageSection number="i." label="Pillars">
          <div style={{ maxWidth: 1180, margin: '0 auto' }}>
            {/* Column headers — sit above the first hairline */}
            <div className="bc-pillar-head" style={{
              display: 'grid', gridTemplateColumns: '1.25fr 1fr 1fr',
              gap: 56, paddingBottom: 18,
            }}>
              <Mono color="var(--bronze)" size={10}>Discipline</Mono>
              <Mono color="var(--bronze)" size={10}>Typical scope</Mono>
              <Mono color="var(--bronze)" size={10}>Outcomes</Mono>
            </div>

            {pillars.map((p, i) => (
              <article key={p.n} className="bc-pillar-row" style={{
                display: 'grid', gridTemplateColumns: '1.25fr 1fr 1fr',
                gap: 56, alignItems: 'start',
                padding: '36px 0 40px',
                borderTop: '1px solid var(--hairline-bronze)',
                borderBottom: i === pillars.length - 1 ? '1px solid var(--hairline-bronze)' : 'none',
              }}>
                {/* COL 1 — discipline */}
                <div>
                  <Mono color="var(--bronze)" size={11}>{p.n}</Mono>
                  <h3 style={{
                    marginTop: 14,
                    fontFamily: 'var(--font-display)', fontWeight: 400,
                    fontSize: 30, lineHeight: 1.18, letterSpacing: '-0.004em',
                    color: 'var(--charcoal)',
                  }}>{p.t}</h3>
                  <p style={{
                    marginTop: 16,
                    fontFamily: 'var(--font-display)', fontStyle: 'italic',
                    fontSize: 17, lineHeight: 1.5,
                    color: 'var(--charcoal)', opacity: 0.82,
                    maxWidth: 360,
                  }}>{p.lead}</p>
                </div>

                {/* COL 2 — scope */}
                <ul style={{ listStyle: 'none', margin: 0, padding: 0 }}>
                  {p.scope.map(item => (
                    <li key={item} style={{
                      position: 'relative',
                      padding: '0 0 14px 18px',
                      fontSize: 15.5, lineHeight: 1.55,
                      color: 'var(--charcoal)', opacity: 0.88,
                    }}>
                      <span style={{ position: 'absolute', left: 0, top: 0, color: 'var(--bronze)' }}>—</span>
                      {item}
                    </li>
                  ))}
                </ul>

                {/* COL 3 — outcomes */}
                <ul style={{ listStyle: 'none', margin: 0, padding: 0 }}>
                  {p.outcomes.map(item => (
                    <li key={item} style={{
                      position: 'relative',
                      padding: '0 0 14px 18px',
                      fontSize: 15.5, lineHeight: 1.55,
                      color: 'var(--charcoal)', opacity: 0.88,
                    }}>
                      <span style={{ position: 'absolute', left: 0, top: 0, color: 'var(--bronze)' }}>—</span>
                      {item}
                    </li>
                  ))}
                </ul>
              </article>
            ))}
          </div>
        </PageSection>

        {/* Framework — clean two-up grid (3 rows × 2 columns) so the eye
            doesn't have to traverse a full-width table. Stronger phase
            numbers, tightened body copy, single bronze rule per cell. */}
        <PageSection number="ii." label="Framework" background="var(--warm-grey)">
          <div style={{ maxWidth: 1180, margin: '0 auto' }}>
            <p style={{
              maxWidth: 760,
              fontFamily: 'var(--font-display)', fontStyle: 'italic',
              fontSize: 22, lineHeight: 1.45,
              color: 'var(--charcoal)', opacity: 0.85,
              margin: 0, marginBottom: 48,
            }}>
              A seven-phase framework, scalable across concept, development
              and operational delivery.
            </p>

            <div className="bc-fw2" style={{
              display: 'grid', gridTemplateColumns: '1fr 1fr',
              columnGap: 80, rowGap: 0,
            }}>
              {phases.map((p, i) => (
                <div key={p.n} className="bc-fw2-phase" style={{
                  padding: '28px 0 30px',
                  borderTop: '1px solid var(--hairline-bronze)',
                  display: 'grid', gridTemplateColumns: '64px 1fr', gap: 24,
                  alignItems: 'baseline',
                  // The 7th (terminal) phase spans both columns so the
                  // framework closes on a single culminating row rather
                  // than sitting half-empty at the bottom of the grid.
                  gridColumn: i === phases.length - 1 ? '1 / -1' : undefined,
                }}>
                  <Mono color="var(--bronze)" size={11}>{p.n}</Mono>
                  <div>
                    <h4 style={{
                      margin: 0,
                      fontFamily: 'var(--font-display)', fontWeight: 400,
                      fontSize: 22, lineHeight: 1.22, letterSpacing: '-0.002em',
                      color: 'var(--charcoal)',
                    }}>{p.t}</h4>
                    <p style={{
                      marginTop: 10,
                      fontSize: 14.5, lineHeight: 1.7,
                      color: 'var(--charcoal)', opacity: 0.78,
                      maxWidth: i === phases.length - 1 ? 760 : undefined,
                    }}>{p.body}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </PageSection>

        {/* Operating commitments */}
        <PageSection number="iii." label="Operating commitments">
          <div style={{ maxWidth: 1180, margin: '0 auto', display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 56 }}>
            {[
              ['Independent oversight',  'No vendor bias. Partner and supplier selection is led by project need.'],
              ['Single accountable lead', 'One named point of accountability across creative, technical, commercial and governance workstreams.'],
              ['Scaled to need',          'Engagement scope and cadence sized to the project.'],
            ].map(([t, b]) => (
              <div key={t} style={{ paddingTop: 22, borderTop: '1px solid var(--bronze)' }}>
                <h3 style={{ fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 22, lineHeight: 1.25, color: 'var(--charcoal)', margin: 0 }}>{t}</h3>
                <p style={{ marginTop: 12, fontSize: 14.5, lineHeight: 1.7, color: 'var(--charcoal)', opacity: 0.78 }}>{b}</p>
              </div>
            ))}
          </div>
        </PageSection>

        <SiteFooter />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<ServicesPage />);
})();
  </script>
</body>
</html>
