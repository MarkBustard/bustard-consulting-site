<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Experience · Bustard Consulting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/tokens.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TX8VCPEDJW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-TX8VCPEDJW');
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="js/direction-shared.jsx"></script>
  <script type="text/babel" src="js/layout.jsx"></script>
  <script type="text/babel" src="js/experience-data.jsx"></script>
  <script type="text/babel" src="js/experience-ui.jsx"></script>
  <script type="text/babel" data-presets="react">
(function() {
  const PAD = 96;
  const MAX = 1280;
  const { useState, useCallback } = React;

  function ExperiencePage() {
    const [filter, setFilter] = useState('All');
    const [detail, setDetail] = useState(null);     // { project }
    const [lightbox, setLightbox] = useState(null); // { images, startIdx }

    const openDetail = (p) => setDetail(p);
    const closeDetail = () => setDetail(null);
    const openLightbox = useCallback((images, startIdx) => setLightbox({ images, startIdx }), []);
    const closeLightbox = () => setLightbox(null);

    const matches = (p) => filter === 'All' || p.disciplines.includes(filter);
    const featured = EXPERIENCE_FEATURED.filter(matches);
    const archive  = EXPERIENCE_ARCHIVE.filter(matches);

    return (
      <div data-screen-label="Experience">
        <SiteNav active="experience" />

        <PageHeader
          number="§ 04"
          label="Experience"
          title="A documentary record."
          lede="Selected work across IP-development, live, immersive, public events and emerging technology — spanning strategic advisory, commercial modelling and executive production."
          sweep={5}
        />

        <FilterBar disciplines={EXPERIENCE_DISCIPLINES} active={filter} onChange={setFilter} />

        {/* Featured count + empty state */}
        {featured.length === 0 && archive.length === 0 && (
          <section style={{ padding: `${PAD}px ${PAD}px`, textAlign: 'center' }}>
            <p style={{ fontFamily: 'var(--font-display)', fontStyle: 'italic', fontSize: 22, color: 'var(--charcoal)', opacity: 0.7 }}>
              No projects match this filter.
            </p>
          </section>
        )}

        {/* ── FEATURED ─────────────────────────────────── */}
        {featured.length > 0 && (
          <section>
            <div style={{
              padding: `${PAD * 0.7}px ${PAD}px 0`,
              maxWidth: MAX, margin: '0 auto',
              display: 'grid', gridTemplateColumns: '120px 1fr', gap: 48,
            }}>
              <Mono color="var(--bronze)" size={10}>i.</Mono>
              <div>
                <h2 style={{
                  margin: 0,
                  fontFamily: 'var(--font-display)', fontWeight: 400,
                  fontSize: 34, lineHeight: 1.18, color: 'var(--charcoal)',
                }}>Featured projects.</h2>
                <p style={{
                  marginTop: 12,
                  fontFamily: 'var(--font-display)', fontStyle: 'italic',
                  fontSize: 17, lineHeight: 1.5,
                  color: 'var(--charcoal)', opacity: 0.7,
                  maxWidth: 720,
                }}>
                  Six flagship case studies demonstrating strategic advisory, development and executive leadership across live, IP-led and emerging technology projects.
                </p>
              </div>
            </div>

            {featured.map((p, i) => (
              <FeaturedCase
                key={p.id}
                project={p}
                index={i}
                onOpen={openDetail}
                onOpenLightbox={openLightbox}
              />
            ))}
          </section>
        )}

        {/* ── ARCHIVE ─────────────────────────────────── */}
        {archive.length > 0 && (
          <section style={{
            padding: `${PAD * 1.1}px ${PAD}px ${PAD * 1.2}px`,
            background: 'var(--warm-grey)',
            borderTop: '1px solid var(--hairline-bronze)',
          }}>
            <div style={{ maxWidth: MAX, margin: '0 auto' }}>
              <div style={{
                display: 'grid', gridTemplateColumns: '120px 1fr', gap: 48,
                alignItems: 'baseline', marginBottom: 56,
              }}>
                <Mono color="var(--bronze)" size={10}>ii.</Mono>
                <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 24 }}>
                  <h2 style={{
                    margin: 0,
                    fontFamily: 'var(--font-display)', fontWeight: 400,
                    fontSize: 34, lineHeight: 1.18, color: 'var(--charcoal)',
                  }}>Selected archive.</h2>
                  <Mono color="var(--charcoal)" size={9} style={{ opacity: 0.45 }}>
                    {archive.length} {archive.length === 1 ? 'entry' : 'entries'}
                  </Mono>
                </div>
              </div>

              <div style={{
                display: 'grid',
                gridTemplateColumns: 'repeat(4, 1fr)',
                columnGap: 24, rowGap: 56,
              }}>
                {archive.map(p => (
                  <ArchiveCard key={p.id} project={p} onOpen={openDetail} />
                ))}
              </div>
            </div>
          </section>
        )}

        <SiteFooter />

        {/* Overlays */}
        {detail && (
          <DetailModal project={detail} onClose={closeDetail} onOpenLightbox={openLightbox} />
        )}
        {lightbox && (
          <ExpLightbox images={lightbox.images} startIdx={lightbox.startIdx} onClose={closeLightbox} />
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<ExperiencePage />);
})();
  </script>
</body>
</html>
