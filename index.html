<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bustard Consulting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/tokens.css" />
  <style>
    html, body { margin: 0; padding: 0; background: var(--warm-white); }
    /* DirectionC renders at a fixed 1440px design width — center it on the page. */
    #root { display: flex; justify-content: center; }

    /* Hero architectural sweep — draws on from left to right on load,
       mirroring the sweep's own L→R gesture. Keyframes live here so the
       animation only runs on the live page; print exports render static. */
    @keyframes bc-sweep-draw {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0 0 0); }
    }
    .bc-hero-sweep {
      animation: bc-sweep-draw 1500ms cubic-bezier(0.22, 0.61, 0.36, 1) 200ms both;
    }
    @media (prefers-reduced-motion: reduce) {
      .bc-hero-sweep { animation: none; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="js/direction-shared.jsx"></script>
  <script type="text/babel" src="js/direction-c.jsx"></script>

  <script type="text/babel" data-presets="react">
    (function() {
      ReactDOM.createRoot(document.getElementById('root')).render(<DirectionC />);
    })();
  </script>
</body>
</html>
