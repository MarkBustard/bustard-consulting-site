<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Practice · Bustard Consulting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/tokens.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="js/direction-shared.jsx"></script>
  <script type="text/babel" src="js/layout.jsx"></script>
  <script type="text/babel" data-presets="react">
(function() {

  function PracticePage() {
    return (
      <div data-screen-label="Practice">
        <SiteNav active="practice" />

        <PageHeader
          number="§ 02"
          label="Practice"
          title="A bridge between creative ambition and operational reality."
          lede="Independent strategic advisory and executive production for live, entertainment and immersive experience projects."
          sweep={1}
        />

        {/* About */}
        <PageSection number="i." label="About">
          <div>
            {/* Lead — full body-column width so the four-term intersection
                line stays on one row at its display size. */}
            <h2 style={{
              fontFamily: 'var(--font-display)', fontSize: 30, fontWeight: 400,
              lineHeight: 1.3, color: 'var(--charcoal)',
              margin: 0,
              whiteSpace: 'nowrap',
            }}>
              Operating at the intersection of Creative × Technical × Commercial × Governance.
            </h2>
            {/* Body — re-flowed below, constrained for readability. */}
            <div style={{ marginTop: 48, maxWidth: 760 }}>
              <p style={{ fontSize: 16, lineHeight: 1.8, color: 'var(--charcoal)', opacity: 0.85 }}>
                Bustard Consulting operates at the intersection of creative
                development, technical innovation and commercial strategy
                across live, immersive and IP-led entertainment.
              </p>
              <p style={{ marginTop: 20, fontSize: 16, lineHeight: 1.8, color: 'var(--charcoal)', opacity: 0.85 }}>
                The consultancy combines strategic advisory, commercial modelling,
                development support and executive production across live,
                immersive, cultural and location-based experiences — bridging
                early-stage concept development through to operational
                delivery and investment readiness.
              </p>
              <p style={{ marginTop: 20, fontSize: 16, lineHeight: 1.8, color: 'var(--charcoal)', opacity: 0.85 }}>
                Recent work includes advising on immersive IP platforms, touring and
                residency frameworks, venue strategy, rights-holder partnerships and
                the application of real-time, AI and virtual production technologies
                within live environments. Drawing on a background spanning major
                public events, rights-holder consulting and founder-led advisory,
                the practice focuses on aligning creative ambition with commercially
                viable audience experiences.
              </p>
            </div>
          </div>
        </PageSection>

        {/* Founder */}
        <PageSection number="ii." label="Founder" background="var(--warm-grey)">
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.2fr', gap: 64, alignItems: 'start' }}>
            <div style={{
              width: '100%', height: 580,
              backgroundImage: 'url(assets/portrait-duotone.webp)',
              backgroundSize: 'cover', backgroundPosition: 'center 28%',
              opacity: 0.95,
            }} />
            <div>
              <Mono color="var(--bronze)" size={10}>Mark Bustard · Principal</Mono>
              <h2 style={{ marginTop: 22, fontFamily: 'var(--font-display)', fontSize: 38, fontWeight: 400, lineHeight: 1.18, color: 'var(--charcoal)' }}>
                Executive Producer at Dimension Studios, DNEG 360 and Journey Group. Founder and former Managing Director of The nvisible Agency.
              </h2>
              <p style={{ marginTop: 26, fontSize: 15.5, lineHeight: 1.8, color: 'var(--charcoal)', opacity: 0.82 }}>
                Over two decades, Mark Bustard has led the structuring and
                delivery of large-scale public events, immersive platforms and
                IP-led audience experiences spanning London 2012, Super Bowl
                programmes, London New Year's Eve, F1 Live and real-time
                digital-human productions.
              </p>
              <p style={{ marginTop: 18, fontSize: 15.5, lineHeight: 1.8, color: 'var(--charcoal)', opacity: 0.82 }}>
                Responsible for multi-territory commercial modelling across UK, EU and US —
                CAPEX / OPEX structuring, EBITDA forecasting and venue strategy across
                immersive and residency platforms — supporting board-level investment
                decisions at Group level.
              </p>

              <div style={{ marginTop: 36 }}>
                <Mono color="var(--bronze)" size={9}>Core Capabilities</Mono>
                <ul style={{ listStyle: 'none', marginTop: 18 }}>
                  {[
                    ['IP Platform Development', 'Commercial structuring for live, residency and touring IP'],
                    ['P&L Oversight', 'EBITDA forecasting; multi-scenario financial models'],
                    ['Multi-Territory Modelling', 'UK / EU / US — CAPEX, OPEX, cashflow'],
                    ['Venue & Touring Strategy', 'Framework design; lease negotiation; partnerships'],
                    ['Rights-Holder Advisory', 'Boards, investors, estates, promoters'],
                    ['Governance & Risk', 'RACI, programme management, delivery charters'],
                  ].map(([k, v]) => (
                    <li key={k} style={{
                      display: 'grid', gridTemplateColumns: '220px 1fr', gap: 28,
                      padding: '14px 0', borderTop: '1px solid var(--hairline-charcoal)',
                      fontSize: 13,
                    }}>
                      <span style={{ fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.16em', textTransform: 'uppercase', color: 'var(--bronze)' }}>{k}</span>
                      <span style={{ color: 'var(--charcoal)', opacity: 0.78 }}>{v}</span>
                    </li>
                  ))}
                </ul>
              </div>
            </div>
          </div>
        </PageSection>

        {/* Career — chronology */}
        <PageSection number="iii." label="Career">
          <p style={{ maxWidth: 880, fontFamily: 'var(--font-display)', fontStyle: 'italic', fontSize: 22, lineHeight: 1.45, color: 'var(--charcoal)', opacity: 0.78, marginBottom: 48 }}>
            From global event execution into rights-holder consulting and IP commercial structuring — building financially viable touring and residency models across sport, culture and entertainment.
          </p>

          {[
            {
              yr: '2023 — Present',
              org: 'Dimension Studios / DNEG 360 — Journey Group',
              role: 'Executive Producer & Head of Live',
              body: 'Operates across two complementary remits at Group level. As Executive Producer for IP Platforms — leading commercial modelling and strategic structuring of immersive, touring and residency platforms across UK, EU and US. As Head of Live for Dimension Studio and DNEG 360 — translating film-grade virtual production, real-time workflows and AI into scalable live and immersive formats.',
            },
            {
              yr: '2019 — 2023',
              org: 'The nvisible Agency',
              role: 'Managing Director / Founder',
              body: 'Co-founded with legendary promoter Harvey Goldsmith. Built a live production and strategic consulting practice — developing commercially structured live and immersive concepts for promoters, rights-holders and investors. Led commercial modelling for HUMAN (Festival of Immersive Storytelling, in partnership with London & Partners) and advised UNBOXED: Creativity in the UK. Clients included Live Nation, Festival Republic, BBC and major global promoters.',
            },
            {
              yr: '2018',
              org: 'CSM Sport & Entertainment',
              role: 'Group Head of Fan Engagement',
              body: 'Senior leader within CSM\u2019s Global Consulting division. Developed integrated IP and event-led commercial models for brands and rights holders. Shaped long-term financial and operational planning for the MLB London Series, supporting MLB\u2019s entry into the European market.',
            },
            {
              yr: '2012 — 2017',
              org: 'Freelance — Wasserman, Jack Morton Worldwide & Others',
              role: 'Executive Producer · Major Public Events & Global Activations',
              body: 'London 2012 Olympic sponsorship activation for EDF Energy at the London Eye. Super Bowl XLVIII activation for Verizon at the Empire State Building. London New Year\u2019s Eve Fireworks across four consecutive editions, broadcast to 12m+ via BBC. F1 Live London attracting 100,000+. Creative Producer for U2 \u201CSongs of Experience\u201D international promotional events.',
            },
          ].map(c => (
            <div key={c.org} style={{
              display: 'grid', gridTemplateColumns: '160px 1.2fr 1.6fr',
              gap: 48, alignItems: 'start',
              padding: '28px 0', borderTop: '1px solid var(--hairline-bronze)',
            }}>
              <Mono color="var(--bronze)" size={11}>{c.yr}</Mono>
              <div>
                <h4 style={{ fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 19, lineHeight: 1.3, color: 'var(--charcoal)' }}>{c.org}</h4>
                <div style={{ marginTop: 6, fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.16em', textTransform: 'uppercase', color: 'var(--olive)', opacity: 0.8 }}>{c.role}</div>
              </div>
              <p style={{ fontSize: 13.5, lineHeight: 1.75, color: 'var(--charcoal)', opacity: 0.78 }}>{c.body}</p>
            </div>
          ))}
          <div style={{ height: 1, background: 'var(--hairline-bronze)' }} />
        </PageSection>

        {/* Principles + Tone of Voice removed — tone is communicated
            implicitly through typography, pacing and writing style; the
            two commercially meaningful commitments live in Services
            alongside Engagement Models. */}

        <SiteFooter />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<PracticePage />);
})();
  </script>
</body>
</html>
